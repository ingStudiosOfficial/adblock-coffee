name: "Create release"
on:
  push:
    branches:
      - "master"
      - "release/**"
  workflow_dispatch:

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version_output: ${{ steps.version.outputs.project_version }}
      upload_url_output: ${{ steps.release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64

      - name: Get project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "project_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create github release
        id: release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          body_path: CHANGELOG.md
          tag_name: adblock-coffee-${{ steps.version.outputs.project_version }}
          release_name: adblock-coffee-${{ steps.version.outputs.project_version }}


  build:
    name: build project (${{ matrix.rust-target }})
    runs-on: ${{ matrix.os }}
    needs: create-release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            java-architecture: x64

          - os: macos-15-intel
            rust-target: x86_64-apple-darwin
            java-architecture: x64

          - os: macos-latest
            rust-target: aarch64-apple-darwin
            java-architecture: arm64

          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            java-architecture: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust-target }}

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          architecture: ${{ matrix.java-architecture }}

      - name: Build Rust native library
        run: cargo build --release --target ${{ matrix.rust-target }} --manifest-path adblock-rs/Cargo.toml

      - name: Copy native library
        shell: bash
        run: |
          mkdir -p target/lib

          case "$RUNNER_OS" in
            Linux)
              LIB="libadblock_coffee.so"
              ;;
            Windows)
              LIB="adblock_coffee.dll"
              ;;
            macOS)
              LIB="libadblock_coffee.dylib"
              ;;
          esac

          cp "adblock-rs/target/release/$LIB" "target/lib/$LIB"

      - name: Build Java library
        run: mvn package

      - name: Create archive
        uses: vimtor/action-zip@5f1c4aa587ea41db1110df6a99981dbe19cee310
        with:
          files: ./target
          dest: adblock-coffee-${{ matrix.rust-target }}-${{ needs.create-release.outputs.version_output }}.zip
          recursive: true

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url_output }}
          asset_name: adblock-coffee-${{ matrix.rust-target }}-${{ needs.create-release.outputs.version_output }}.zip
          asset_path: adblock-coffee-${{ matrix.rust-target }}-${{ needs.create-release.outputs.version_output }}.zip
          asset_content_type: application/zip
