build:
    name: build project (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: formatting

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java-architecture: x64
          - os: windows-latest
            java-architecture: x64
          - os: macos-latest
            java-architecture: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust library
        run: cargo build --manifest-path adblock-rs/Cargo.toml

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          architecture: ${{ matrix.java-architecture }}

      - name: Build Java library
        run: mvn package
