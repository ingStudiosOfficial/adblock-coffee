
name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build for macOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          architecture: aarch64
          cache: maven

      - name: Show Maven version
        run: mvn --version

      - name: Build Rust native library
        run: |
          cargo build \
            --release \
            --target aarch64-apple-darwin \
            --manifest-path adblock-rs/Cargo.toml

      - name: Verify native library
        shell: bash
        run: |
          echo "=== Dynamic libraries ==="
          find adblock-rs/target/aarch64-apple-darwin/release \
            -maxdepth 2 -type f \
            \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) \
            -print

          LIB="$(find adblock-rs/target/aarch64-apple-darwin/release \
            -maxdepth 1 -type f -name '*.dylib' -print -quit)"

          if [ -z "$LIB" ]; then
            echo "ERROR: No .dylib found. Check the Cargo build output."
            exit 1
          fi

          echo "Found: $LIB"
          file "$LIB"
          lipo -info "$LIB"

          echo "NATIVE_LIB=$LIB" >> "$GITHUB_ENV"

      - name: Build Maven package
        run: mvn --batch-mode clean package -DskipTests

      - name: Stage native library
        run: |
          mkdir -p target/lib
          cp "$NATIVE_LIB" target/lib/
          ls -lh target/lib/

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: adblock-coffee-macos-arm64-dylib
          path: target/lib/*.dylib
          if-no-files-found: error
          retention-days: 30

      - name: Upload Maven build output
        uses: actions/upload-artifact@v4
        with:
          name: adblock-coffee-macos-arm64-package
          path: |
            target/*.jar
            target/*.zip
          if-no-files-found: warn
          retention-days: 30
