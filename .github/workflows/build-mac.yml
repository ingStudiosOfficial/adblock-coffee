
name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build for macOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          architecture: aarch64
          cache: maven

      - name: Set up Maven
        run: mvn --version

      - name: Build Rust native library
        run: |
          cargo build \
            --release \
            --target aarch64-apple-darwin \
            --manifest-path adblock-rs/Cargo.toml

      - name: Verify native library
        run: |
          LIB="adblock-rs/target/aarch64-apple-darwin/release/libadblock_coffee.dylib"

          if [ ! -f "$LIB" ]; then
            echo "ERROR: Native library not found: $LIB"
            echo "Available files:"
            find adblock-rs/target/aarch64-apple-darwin/release -maxdepth 2 -type f
            exit 1
          fi

          file "$LIB"
          lipo -info "$LIB"

      - name: Prepare Maven native library directory
        run: |
          mkdir -p target/lib
          cp adblock-rs/target/aarch64-apple-darwin/release/libadblock_coffee.dylib target/lib/

          ls -lh target/lib/

      - name: Build Maven package
        run: mvn --batch-mode clean package -DskipTests

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: adblock-coffee-macos-arm64-dylib
          path: target/lib/libadblock_coffee.dylib
          if-no-files-found: error
          retention-days: 30

      - name: Upload Maven build output
        uses: actions/upload-artifact@v4
        with:
          name: adblock-coffee-macos-arm64-package
          path: |
            target/*.jar
            target/*.zip
          if-no-files-found: warn
          retention-days: 30
